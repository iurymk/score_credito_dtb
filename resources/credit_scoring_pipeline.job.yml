# Pipeline de MLOps de credit scoring (execução sob demanda, sem agendamento nem retreino automático):
#
#  ingest_data ─▶ prepare_data ─▶ train_register ─▶ evaluate_promote ─┬─▶ batch_inference
#   (bronze)        (silver)        (UC: nova versão)   (@champion)      └─▶ deploy_endpoint
#
# Fail fast: sem retries (inclusive os retries automáticos do serverless), timeout por tarefa, validações de dados
# e portões de qualidade lançam exceção antes das etapas seguintes, e max_concurrent_runs: 1 evita duas execuções
# disputando o @champion.
resources:
  jobs:
    credit_scoring_pipeline:
      name: "[${bundle.target}] credit-scoring-pipeline"
      description: Ingestão → qualidade e splits → treino e registro no UC → avaliação e @champion → lote + endpoint
      max_concurrent_runs: 1
      timeout_seconds: 7200
      queue:
        enabled: true
      email_notifications:
        on_failure:
          - ${var.notification_email}
      tags:
        project: credit-scoring-mlops

      parameters:
        - { name: catalog, default: "${var.catalog}" }
        - { name: schema, default: "${resources.schemas.credit_schema.name}" }
        - { name: volume, default: "${resources.volumes.raw_data.name}" }
        - { name: model_name, default: "${var.catalog}.${resources.schemas.credit_schema.name}.${resources.registered_models.credit_scoring_model.name}" }
        - { name: experiment_path, default: "${resources.experiments.credit_experiment.name}" }
        - { name: min_auc, default: "${var.min_auc}" }
        - { name: min_ks, default: "${var.min_ks}" }
        - { name: max_fairness_gap, default: "${var.max_fairness_gap}" }
        - { name: score_split, default: "test" }
        - { name: endpoint_name, default: "${var.endpoint_name}" }
        - { name: workload_size, default: "Small" }
        - { name: deploy_timeout_minutes, default: "40" }
        - { name: enable_inference_table, default: "true" }
        - { name: job_run_id, default: "{{job.run_id}}" }

      environments:
        # Serverless CPU com as mesmas versões em todas as tarefas: o modelo treinado aqui carrega igual na
        # avaliação, no lote e no endpoint (o pip_requirements do modelo é gerado a partir deste ambiente).
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - mlflow==3.13.0
              - scikit-learn==1.9.1
              - xgboost==3.4.1
              - shap==0.53.0
              - matplotlib==3.10.7
              - databricks-sdk==0.67.0

      tasks:
        - task_key: ingest_data
          environment_key: default
          timeout_seconds: 1200
          max_retries: 0
          disable_auto_optimization: true  # sem retries ocultos do serverless: falha rápido, corrige, repair-run
          notebook_task:
            notebook_path: ../src/jobs/01_ingest_data.py

        - task_key: prepare_data
          depends_on: [{ task_key: ingest_data }]
          environment_key: default
          timeout_seconds: 1200
          max_retries: 0
          disable_auto_optimization: true
          notebook_task:
            notebook_path: ../src/jobs/02_prepare_data.py

        - task_key: train_register
          depends_on: [{ task_key: prepare_data }]
          environment_key: default
          timeout_seconds: 2400
          max_retries: 0
          disable_auto_optimization: true
          notebook_task:
            notebook_path: ../src/jobs/03_train_register.py

        - task_key: evaluate_promote
          depends_on: [{ task_key: train_register }]
          environment_key: default
          timeout_seconds: 1800
          max_retries: 0
          disable_auto_optimization: true
          notebook_task:
            notebook_path: ../src/jobs/04_evaluate_promote.py
            base_parameters:
              model_version: "{{tasks.train_register.values.model_version}}"

        - task_key: batch_inference
          depends_on: [{ task_key: evaluate_promote }]
          environment_key: default
          timeout_seconds: 1800
          max_retries: 0
          disable_auto_optimization: true
          notebook_task:
            notebook_path: ../src/jobs/05_batch_inference.py
            base_parameters:
              model_version: "{{tasks.evaluate_promote.values.champion_version}}"

        - task_key: deploy_endpoint
          depends_on: [{ task_key: evaluate_promote }]
          environment_key: default
          timeout_seconds: 3000
          max_retries: 0
          disable_auto_optimization: true
          notebook_task:
            notebook_path: ../src/jobs/06_deploy_endpoint.py
            base_parameters:
              model_version: "{{tasks.evaluate_promote.values.champion_version}}"
